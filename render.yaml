services:
  - type: web
    name: tern-radio
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --worker-class gevent --worker-connections 1000 --bind 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile - wsgi:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: CANONICAL_DOMAIN
        value: ternradio.org
      - key: ANTHROPIC_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure value
    autoDeploy: true
